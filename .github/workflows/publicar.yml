name: publicar pacotes

# O dicionário é a fonte de verdade dos dois apps, então mudar dado aqui tem que
# chegar aos dois. A publicação é por tag, não por push em main: `latest/download`
# (que é o que o Android segue) só se move quando há release, e um push em main
# mudaria os dados sem o app perceber.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (formato vYYYY.MM.DD.XX, ex: v2026.01.18.1)'
        required: true

# Mínimo por padrão; só o job que cria a release recebe escrita.
permissions:
  contents: read

# Duas publicações da mesma tag nunca correm juntas (a segunda faria
# `gh release upload --clobber` no meio da primeira). Não cancela: uma
# publicação em andamento termina.
concurrency:
  group: publicar-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Regra 2 do GEMINI.md: tags de dados são `vYYYY.MM.DD.XX`. Falha antes
      # de gastar o build se a tag vier fora do formato (ex.: `v1.4.2`, que é
      # tag do app e não do dicionário).
      - name: Validar formato da tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])\.[0-9]{1,3}$ ]]; then
            echo "::error::Tag '$TAG' fora do formato vYYYY.MM.DD.XX"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Mesma major do `mise.toml` (node = "26").
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      # O build é Node puro de propósito: sem `npm install`, o CI roda em
      # segundos e não pode falhar por dependência que ninguém pediu.
      #
      # `npm run build` roda os gates ANTES de empacotar, e cada um sai com
      # código 1 quando reprova:
      #   tabelas  — chave duplicada nas tabelas do lemmatizer (o defeito que
      #              produziu lema errado sem erro de sintaxe)
      #   lemma    — o padrão de ouro, com substantivos como bloco de bloqueio
      #   check    — integridade dos pacotes, incluindo radical falso em escala
      #
      # Sem os três, o CI publicava pacote com radical corrompido: foi assim
      # que `noite → noi` e `abismo → abis` chegaram aos dois apps.
      - name: Gates, índices e empacotamento
        run: npm run build

      # Checksums de tudo que vai para a release, para quem baixa (Android,
      # scripts) poder conferir integridade.
      - name: SHA256SUMS
        working-directory: _build/dist
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # O CI dispara por push de tag, então a tag já existe e é este
          # workflow que a materializa em release.
          EXTRA_ASSETS=(_build/dist/SHA256SUMS.txt)
          [ -f "bolls-index.json" ] && EXTRA_ASSETS+=("bolls-index.json")
          gh release create "$TAG" _build/dist/*.zip "${EXTRA_ASSETS[@]}" \
            --title "Dict packs $TAG" \
            --notes "Pacotes de dicionário e dados. Consumido pelo Scriptorium Android em runtime e pelo web via submódulo." \
          || gh release upload "$TAG" _build/dist/*.zip "${EXTRA_ASSETS[@]}" --clobber

      - name: Resumo
        run: |
          {
            echo "## Pacotes — ${{ github.event.inputs.tag || github.ref_name }}"
            echo
            echo "| asset | tamanho |"
            echo "|---|---|"
            for f in _build/dist/*.zip; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
